name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.9'

jobs:
  # ========================================
  # DCO enforcement — every commit must be signed off
  # ========================================
  dco:
    name: DCO Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on all commits
        run: |
          echo "## DCO Verification" >> $GITHUB_STEP_SUMMARY
          MISSING=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --format="%H" origin/${{ github.base_ref }}..HEAD)
            STRICT=1
          else
            COMMITS=$(git log --format="%H" -1)
            STRICT=0
          fi
          for COMMIT in $COMMITS; do
            AUTHOR=$(git log --format="%an" -1 $COMMIT)
            EMAIL=$(git log --format="%ae" -1 $COMMIT)
            SUBJECT=$(git log --format="%s" -1 $COMMIT)
            if echo $AUTHOR | grep -qiE '(dependabot|renovate|github-actions)\[bot\]$|bot$' || echo $EMAIL | grep -qiE '(dependabot|renovate|github-actions)\[bot\]|bot@|\[bot\]'; then
              echo "⏭️ Skipping DCO for bot commit: $SUBJECT ($AUTHOR)" >> $GITHUB_STEP_SUMMARY
              continue
            fi
            PARENT_COUNT=$(git rev-list --parents -1 $COMMIT | wc -w) || true
            if [ "$PARENT_COUNT" -gt 2 ]; then
              echo "⏭️ Skipping DCO for merge commit: $SUBJECT" >> $GITHUB_STEP_SUMMARY
              continue
            fi
            FULL_MSG=$(git log --format="%B" -1 $COMMIT)
            if ! echo "$FULL_MSG" | grep -q "Signed-off-by:"; then
              echo "❌ Missing Signed-off-by: $SUBJECT ($AUTHOR <$EMAIL>)" >> $GITHUB_STEP_SUMMARY
              echo "   Fix: git commit --amend -s" >> $GITHUB_STEP_SUMMARY
              MISSING=1
            else
              SIGNOFF=$(echo "$FULL_MSG" | grep "Signed-off-by:" | head -1)
              echo "✅ Signed-off: $SUBJECT" >> $GITHUB_STEP_SUMMARY
              echo "   $SIGNOFF" >> $GITHUB_STEP_SUMMARY
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please amend commits with: git commit --amend --signoff" >> $GITHUB_STEP_SUMMARY
            if [ "$STRICT" -eq 1 ]; then
              echo "❌ DCO check failed — all PR commits must include Signed-off-by" >> $GITHUB_STEP_SUMMARY
              exit 1
            else
              echo "⚠️ DCO advisory: commits without Signed-off-by detected" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**All commits have Signed-off-by** ✅" >> $GITHUB_STEP_SUMMARY
          fi

  # ========================================
  # Lint — go vet + gofmt + go mod tidy
  # ========================================
  lint:
    needs: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet (non-CGO)
        run: CGO_ENABLED=0 go vet ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "UNFORMATTED: $out"; exit 1; fi
      - name: go mod tidy check
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "❌ go.mod/go.sum not tidy — run 'go mod tidy' and commit"
            git diff -- go.mod go.sum || true
            exit 1
          fi
          echo "✅ go.mod is tidy"

  # ========================================
  # Test — non-CGO (heuristic-only, 335 tests)
  # ========================================
  test-lite:
    needs: dco
    name: Test (non-CGO / heuristic-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run tests (non-CGO)
        run: |
          CGO_ENABLED=0 go test -v -coverprofile=coverage-lite.out -covermode=atomic ./... 2>&1 | tee test-output.txt
      - name: Check coverage ≥ 90%
        run: |
          # Extract main package coverage from go test output.
          # Go ≤1.24 prints coverage on the same line as the package path.
          # Go 1.25+ may print coverage on a separate line.
          TOTAL=$(grep '^ok' test-output.txt | grep 'coverage:' | head -1 | sed 's/.*coverage: \([0-9.]*\)%.*/\1/')
          if [ -z "$TOTAL" ]; then
            TOTAL=$(grep 'coverage:' test-output.txt | head -1 | sed 's/.*coverage: \([0-9.]*\)%.*/\1/')
          fi
          echo "Coverage (non-CGO): ${TOTAL}%"
          if [ -z "$TOTAL" ]; then echo "FAIL: could not compute coverage"; exit 1; fi
          PASS=$(echo "$TOTAL >= 90" | bc)
          if [ "$PASS" != "1" ]; then echo "FAIL: coverage ${TOTAL}% < 90%"; exit 1; fi
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lite
          path: coverage-lite.out

  # ========================================
  # Test — CGO (full neural detection, 333 tests)
  # ========================================
  test-ml:
    needs: [lint, test-lite]
    name: Test (CGO / ML-enabled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run tests (CGO)
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: "-I${{ github.workspace }}/internal/onnxruntime_go"
          CGO_LDFLAGS: "-L${{ github.workspace }}/lib/amd64 -lonnxruntime -ldl"
          ONNXRUNTIME_SHARED_LIBRARY_PATH: ${{ github.workspace }}/lib/amd64/libonnxruntime.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/lib/amd64
        run: |
          go test -v -coverprofile=coverage-ml.out -covermode=atomic ./... 2>&1 | tee test-output-ml.txt
      - name: Check coverage ≥ 90%
        run: |
          # Extract main package coverage from go test output.
          # Go ≤1.24 prints coverage on the same line as the package path.
          # Go 1.25+ may print coverage on a separate line.
          TOTAL=$(grep '^ok' test-output-ml.txt | grep 'coverage:' | head -1 | sed 's/.*coverage: \([0-9.]*\)%.*/\1/')
          if [ -z "$TOTAL" ]; then
            TOTAL=$(grep 'coverage:' test-output-ml.txt | head -1 | sed 's/.*coverage: \([0-9.]*\)%.*/\1/')
          fi
          echo "Coverage (CGO): ${TOTAL}%"
          if [ -z "$TOTAL" ]; then echo "FAIL: could not compute coverage"; exit 1; fi
          PASS=$(echo "$TOTAL >= 90" | bc)
          if [ "$PASS" != "1" ]; then echo "FAIL: coverage ${TOTAL}% < 90%"; exit 1; fi
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ml
          path: coverage-ml.out

  # ========================================
  # Race detector — concurrent access validation (CGO required)
  # ========================================
  race:
    needs: [lint, test-lite]
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run race detector (CGO, all tests)
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: "-I${{ github.workspace }}/internal/onnxruntime_go"
          CGO_LDFLAGS: "-L${{ github.workspace }}/lib/amd64 -lonnxruntime -ldl"
          ONNXRUNTIME_SHARED_LIBRARY_PATH: ${{ github.workspace }}/lib/amd64/libonnxruntime.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/lib/amd64
        run: |
          go test -race -count=1 -timeout 300s ./... 2>&1 | tee race-output.txt
          if grep -q "DATA RACE" race-output.txt; then
            echo "❌ Data race detected!"
            exit 1
          fi
          echo "✅ No data races detected"

  # ========================================
  # Load tests — k6-style stress/burst/crush/chaos (build tag: load)
  # ========================================
  load-test:
    needs: [lint, test-lite]
    name: Load / Stress / Crush
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run load test suite
        run: |
          CGO_ENABLED=0 go test -tags=load -count=1 -timeout 600s -v ./... 2>&1 | tee load-output.txt
      - name: Verify all load tests passed
        run: |
          FAILS=$(grep -c "^--- FAIL" load-output.txt || true)
          if [ "$FAILS" -gt 0 ]; then
            echo "❌ $FAILS load tests failed"
            exit 1
          fi
          PASSES=$(grep -c "^--- PASS" load-output.txt)
          echo "✅ $PASSES load tests passed"

  # ========================================
  # Benchmark regression — track perf changes with benchstat
  # ========================================
  benchmark:
    needs: [lint, test-lite]
    name: Benchmark Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Run benchmarks (non-CGO)
        run: |
          CGO_ENABLED=0 go test -bench=. -benchmem -benchtime=3s -count=2 -timeout 600s ./... 2>&1 | tee bench-current.txt
      - name: Check for regressions
        run: |
          # Report benchmarks — non-blocking on first run (no baseline to compare)
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          benchstat bench-current.txt 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: bench-current.txt

  # ========================================
  # Build — verify binary compiles (both modes)
  # ========================================
  build:
    needs: [lint, test-lite]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cgo: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build binary (non-CGO)
        if: matrix.cgo == 0
        env:
          CGO_ENABLED: 0
        run: |
          VERSION=$(cat VERSION)
          go build -ldflags="-s -w -X github.com/aegisgatesecurity/aegisgate-mcp.Version=${VERSION}" \
            -o mcp-server ./cmd/mcp-server/
          ls -lh mcp-server
      - name: Build binary (CGO)
        if: matrix.cgo == 1
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: "-I${{ github.workspace }}/internal/onnxruntime_go"
          CGO_LDFLAGS: "-L${{ github.workspace }}/lib/amd64 -lonnxruntime -ldl"
          ONNXRUNTIME_SHARED_LIBRARY_PATH: ${{ github.workspace }}/lib/amd64/libonnxruntime.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/lib/amd64
        run: |
          VERSION=$(cat VERSION)
          go build -ldflags="-s -w -X github.com/aegisgatesecurity/aegisgate-mcp.Version=${VERSION}" \
            -o mcp-server ./cmd/mcp-server/
          ls -lh mcp-server
      - name: Verify binary runs
        if: matrix.cgo == 0
        run: |
          ./mcp-server --help || true  # --help exits with code 1 by design

  # ========================================
  # Docker build + pentest
  # ========================================
  docker:
    needs: [lint, test-lite]
    name: Docker Build + Pentest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Docker Hub login (optional, raises rate limit)
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker image
        id: docker-build
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if docker build --target ml -t aegisgate-mcp:test .; then
              echo "Docker build succeeded on attempt $attempt"
              break
            fi
            echo "Docker build failed on attempt $attempt (likely Docker Hub rate limit), retrying in 30s..."
            sleep 30
            if [ $attempt -eq 3 ]; then
              echo "Docker build failed after 3 attempts — Docker Hub rate limited, skipping pentest"
              exit 1
            fi
          done
      - name: Start container
        if: steps.docker-build.outcome == 'success'
        run: |
          docker run -d --name mcp-test -p 8081:8081 -p 8082:8082 \
            -e MCP_AUTH_TOKEN=test-token-12345 \
            aegisgate-mcp:test --addr :8081 --token test-token-12345
      - name: Wait for healthcheck
        if: steps.docker-build.outcome == 'success'
        run: |
          for i in $(seq 1 30); do
            if wget -q --spider http://localhost:8082/healthz 2>/dev/null; then
              echo "Server is healthy"
              break
            fi
            sleep 1
          done
      - name: Run pentest suite
        if: steps.docker-build.outcome == 'success'
        run: |
          chmod +x pentest/run_pentest.sh
          # Distroless image has no shell — run pentest from host via exposed ports
          bash pentest/run_pentest.sh http://localhost:8081 test-token-12345 || true
      - name: Stop container
        if: always()
        run: docker rm -f mcp-test || true