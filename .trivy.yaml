# Trivy Configuration
# https://aquasecurity.github.io/trivy/latest/docs/configuration/

scan:
  scanners:
    - vuln
    - misconfig
    - secret

severity:
  - CRITICAL
  - HIGH
  - MEDIUM

vulnerability:
  types:
    - os
    - library
  ignore-vulnerabilities:
    - vulnerability-id: DLA-4867-1
      reason: "tzdata timezone database update — no security risk for MCP server"
    - vulnerability-id: DLA-4854-1
      reason: "tzdata timezone database update — no security risk for MCP server"
    - vulnerability-id: DLA-4845-1
      reason: "ca-certificates update — Go binary uses its own CA bundle"

# Ignore certain paths
skip-dirs:
  - tests/
  - docs/
  - "*.md"

# Skip specific files that are known false positives
skip-files:
  - .gitleaks.toml  # Contains fake token pattern in allowlist config

# IaC scanning configuration
misconfig:
  include:
    - Dockerfile
    - docker-compose.yml
    - ".github/workflows/*.yml"

# Secret scanning
secret:
  enabled: true
  config:
    show-secrets: false

# Report format
format: table

# Exit codes
exit-code: 0

# Cache
cache:
  backend: fs